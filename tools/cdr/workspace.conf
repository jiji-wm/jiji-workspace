# Workspace identity for tools/cdr/install.sh.
# NAME: short, lowercase, no spaces — used as the alias name (cdr-NAME)
#       and as the registry key.
# PREFIX: path under the workspace root where group dirs live (with trailing
#         slash). Empty means group dirs sit directly inside the root.
#         For jiji: repos live under repos/<group>/<name>, so group="repos"
#         and PREFIX="" works — the group name "repos" is part of the path.

NAME=jiji
PREFIX=
