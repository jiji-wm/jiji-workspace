# jiji loop targets — consumed by .claude/agents/jiji-* and scripts/loop-subphase.sh
# Format: name|language|code_repo|dd_path|dd_commit_repo
# - name:           argument to /jiji:land-subphase etc.
# - language:       rust | js. Selects which jiji-<language>-implementer runs.
# - code_repo:      where the implementer cd's and source commits land (relative to
#                   workspace root). May be a subdirectory of a git repo (commits land
#                   in the enclosing repo); the architect/implementer read <code_repo>/CLAUDE.md.
# - dd_path:        the design doc with the phased checkboxes (relative to workspace root)
# - dd_commit_repo: where the scribe commits the DD change (. = workspace root)
#
# A DD may serve more than one loop (rows sharing a dd_path), split by component +
# language — see ff-restore (Rust host, src/) and ff-restore-ext (JS extension, extension/).
# When two rows share a DD, ALWAYS name the box explicitly (e.g. /jiji:land-subphase
# ff-restore-ext P4) so the architect plans the box that belongs to your language.
cli|rust|repos/jiji-activities|repos/jiji-activities/docs/design.md|repos/jiji-activities
jiji-do|rust|repos/jiji-do|repos/jiji-do/docs/design.md|repos/jiji-do
ff-restore|rust|repos/jiji-firefox-workspaces|repos/jiji-firefox-workspaces/docs/design.md|repos/jiji-firefox-workspaces
ff-restore-ext|js|repos/jiji-firefox-workspaces/extension|repos/jiji-firefox-workspaces/docs/design.md|repos/jiji-firefox-workspaces
ff-restore-comp|rust|repos/jiji|repos/jiji-firefox-workspaces/docs/design.md|repos/jiji-firefox-workspaces
