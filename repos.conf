# jiji workspace repos
# group | name | url | branch | source

# ── Public repos (jiji-wm org) ────────────────────────────────────────────────
repos | jiji                    | git@github.com:jiji-wm/jiji.git                     | main | github
repos | jiji-activities         | git@github.com:jiji-wm/jiji-activities.git          | main | github
repos | jiji-do                 | git@github.com:jiji-wm/jiji-do.git                  | main | github
repos | jiji-firefox-workspaces | git@github.com:jiji-wm/jiji-firefox-workspaces.git  | main | github
# Fork of projecthamster/hamster (Python/GTK, waf build). Tracks upstream via the
# read-only repos/upstream/hamster mirror below; the working clone keeps the upstream
# as a 'hamster-upstream' remote. Sibling of jiji-hamster-bridge (org.gnome.Hamster
# D-Bus contract). Not Rust — driven by the 'waf' install regime in project-targets.sh.
repos | jiji-hamster            | git@github.com:jiji-wm/jiji-hamster.git             | main | github
repos | jiji-hamster-bridge     | git@github.com:jiji-wm/jiji-hamster-bridge.git      | main | github
# Keyboard-state appearance provider (caps/layout/remote blends → set-appearance-override).
# Private until reviewed; without access the clone is skipped gracefully.
repos | jiji-kbd-indicator      | git@github.com:jiji-wm/jiji-kbd-indicator.git       | main | github
repos | jiji-waybar             | git@github.com:jiji-wm/jiji-waybar.git              | main | github

# ── Upstreams (read-only mirrors of what we fork from) ────────────────────────
repos/upstream | niri    | git@github.com:niri-wm/niri.git             | main                    | github
repos/upstream | waybar  | git@github.com:Alexays/Waybar.git           | master                  | github
repos/upstream | hamster | git@github.com:projecthamster/hamster.git   | master                  | github

# ── Reference (read-only, not forked) ─────────────────────────────────────────
repos/reference | awesome-niri | git@github.com:niri-wm/awesome-niri.git | master               | github

# ── Dev tools (third-party, version-locked to the jiji toolchain) ─────────────
# Tracy profiler GUI. The "branch" field pins a TAG: the GUI must match the
# protocol bundled by tracy-client-sys (TracyVersion.hpp → 0.13.1), or Tracy
# refuses to connect. Build from source (not packaged in Debian); see README.
repos/tools | tracy | https://github.com/wolfpld/tracy.git | v0.13.1 | github

# ── Specs overlay (DDs/specs/plans/status; access-restricted) ────────────────
# The special group `_root` places the repo directly at the workspace root
# (./specs/, gitignored) instead of under a group directory, so path-based
# cross-references from agents, loops.conf, and docs stay stable. Optional:
# requires access; for public contributors the clone is skipped gracefully and
# everything degrades to working without it. Inside the repo, specs are scoped
# by the owner's GitHub username (specs/<github-user>/...) — see CLAUDE.md.
_root | specs | git@github.com:jiji-wm/jiji-specs-private.git | main | github
